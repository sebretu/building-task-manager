name: Build Android APK
on:
  workflow_dispatch:

jobs:
  build_android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Debug directory structure
        run: ls -la && ls -la web

      - name: Install dependencies in web directory
        working-directory: ./web
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Next.js App
        working-directory: ./web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://api.inspecthero.pl' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJFUzI1NiIsImtpZCI6ImI4MTI2OWYxLTIxZDgtNGYyZS1iNzE5LWMyMjQwYTg0MGQ5MCIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjIwODY4OTM2ODR9.86CeEuFUiPu9XZ8IJyrKfxHd2dGkJ7S5bJpJqVNpeZRXeY0YhcWdTsB44lcNPJs6p4gS1dvyelwT9pbd-3Jy7g' }}
          NEXT_PUBLIC_PLATFORM: mobile
          NEXT_DISABLE_TURBOPACK: '1'
        run: npm run build:mobile

      - name: Sync Capacitor
        working-directory: ./web
        run: npx cap sync android

      - name: Build APK
        working-directory: ./web/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: task-manager-android-apk
          path: web/android/app/build/outputs/apk/debug/app-debug.apk
